log_format google_manager_test '$remote_addr $time_local "$request_method $uri" $status $body_bytes_sent';

server {
    listen 127.0.0.1:8443 ssl;
    server_name 127.0.0.1 localhost;
    ssl_certificate /etc/google-manager-online-test/tls/server.crt;
    ssl_certificate_key /etc/google-manager-online-test/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/google-manager-online-test-access.log google_manager_test;
    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
