# ==============================================================================
# Google Manager Nginx 反向代理配置模板
# 适用于反代本地 Gunicorn 服务（端口 8002），配置 SSL 与大文件传输
# ==============================================================================

log_format google_manager_safe '$remote_addr $time_local "$request_method $uri" $status $body_bytes_sent';
access_log /var/log/nginx/google-manager-access.log google_manager_safe;

# HTTP 重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;  # 请替换为您的服务器域名或公网 IP

    # ACME Let's Encrypt 证书验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站点服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;  # 请替换为您的服务器域名

    # SSL 证书配置（推荐使用 Certbot 签发）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全 Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 最大请求体大小（支持大批量账号文件导入）
    client_max_body_size 2M;

    # 就绪检查会访问数据库并校验敏感字段，仅允许本机监控调用。
    location ^~ /health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # 静态资源缓存（Vite 构建产物已携带 contenthash）
    location /assets/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 主应用反向代理
    location / {
        proxy_pass http://127.0.0.1:8002;

        # 代理头传递（用于 Flask 获取真实客户端 IP 及协议）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket 与长轮询
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时时间设置（允许长请求处理）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
