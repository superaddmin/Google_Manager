services:
  google-manager:
    image: &application-image ${GOOGLE_MANAGER_IMAGE:?GOOGLE_MANAGER_IMAGE 必须指定已验收的不可变镜像}
    container_name: google-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    init: true
    security_opt: &browser-security
      - seccomp=./deploy/chromium-seccomp.json
    shm_size: 256mb
    stop_grace_period: 60s
    depends_on:
      initialize:
        condition: service_completed_successfully
    environment: &application-environment
      # 生产环境模式
      - FLASK_ENV=production
      # 管理员面板登录密码（必填，禁止使用默认占位值）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD 必须在 .env 中显式指定强密码}
      - ALLOW_TEST_ADMIN_PASSWORD=${ALLOW_TEST_ADMIN_PASSWORD:-0}
      # Flask 会话加密密钥（生产环境至少 32 字符，禁止使用示例值）
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 必须在 .env 中显式配置至少 32 字符密钥}
      # Gmail OAuth 凭证 Fernet 加密密钥（必填，使用 cryptography.fernet.Fernet.generate_key() 生成）
      - GMAIL_TOKEN_ENCRYPTION_KEY=${GMAIL_TOKEN_ENCRYPTION_KEY:?GMAIL_TOKEN_ENCRYPTION_KEY 必须在 .env 中显式配置}
      # Gmail OAuth 与 API 请求单次网络超时（秒）
      - GMAIL_HTTP_TIMEOUT_SECONDS=${GMAIL_HTTP_TIMEOUT_SECONDS:-30}
      # 充值功能模式（disabled: 禁用, mock: 模拟演示, live: 官方生产履约）
      - RECHARGE_MODE=${RECHARGE_MODE:-disabled}
      - CDK_ENABLED=${CDK_ENABLED:-0}
      - CDK_ACTIVE_KEY_ID=${CDK_ACTIVE_KEY_ID:-v1}
      - CDK_ENCRYPTION_KEYS=${CDK_ENCRYPTION_KEYS:-}
      - CDK_LOOKUP_KEYS=${CDK_LOOKUP_KEYS:-}
      - CDK_SMTP_HOST=${CDK_SMTP_HOST:-}
      - CDK_SMTP_PORT=${CDK_SMTP_PORT:-465}
      - CDK_SMTP_FROM=${CDK_SMTP_FROM:-}
      - CDK_SMTP_USERNAME=${CDK_SMTP_USERNAME:-}
      - CDK_SMTP_PASSWORD=${CDK_SMTP_PASSWORD:-}
      # 充值上游服务 API 地址
      - RECHARGE_UPSTREAM_URL=${RECHARGE_UPSTREAM_URL:-}
      # live 模式上游主机白名单
      - RECHARGE_UPSTREAM_ALLOWED_HOSTS=${RECHARGE_UPSTREAM_ALLOWED_HOSTS:-aichong666.com}
      # 可选外部数据库；未设置时使用持久化 SQLite
      - DATABASE_URL=${DATABASE_URL:-}
      # Google API 客户端凭据文件容器内路径
      - GMAIL_CLIENT_SECRET_FILE=/app/credentials.json
      # 可选公网反向代理回调链接（如配置域名，例如 https://gmail.yourdomain.com/api/gmail/oauth/callback）
      - GMAIL_REDIRECT_URI=${GMAIL_REDIRECT_URI:-}
      # Gmail Pub/Sub（启用 watch/webhook 时配置）
      - GMAIL_PUBSUB_TOPIC=${GMAIL_PUBSUB_TOPIC:-}
      - GMAIL_PUBSUB_VERIFICATION_TOKEN=${GMAIL_PUBSUB_VERIFICATION_TOKEN:-}
      # 可选代理服务；可用性及目标服务访问许可需单独验收
      # 例如: http://username:password@proxy.example.com:8080
      - PROXY=${PROXY:-}
      # Playwright 模式
      - HEADLESS=true
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.30.8.1/32}
      # Gunicorn 可调并发与超时
      - GUNICORN_BIND=${GUNICORN_BIND:-0.0.0.0:8002}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - GUNICORN_LOG_LEVEL=${GUNICORN_LOG_LEVEL:-info}
    volumes: &application-volumes
      # 持久化 SQLite 数据库文件
      - ./instance:/app/instance
      # 持久化自动化任务日志与截图
      - ./googlemail/output:/app/googlemail/output
      # 持久化任务运行临时缓存
      - ./googlemail/runtime:/app/googlemail/runtime
      # 挂载 Google 客户端密钥配置
      - ./credentials.json:/app/credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from app.monitor import probe_readiness; raise SystemExit(0 if probe_readiness('http://127.0.0.1:8002/health/ready') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  initialize:
    image: *application-image
    command: ["python", "-m", "app.manage", "init-db"]
    restart: "no"
    environment: *application-environment
    volumes: *application-volumes

  worker:
    image: *application-image
    command: ["python", "-m", "app.worker"]
    init: true
    security_opt: *browser-security
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 60s
    environment: *application-environment
    volumes: *application-volumes
    depends_on:
      google-manager:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.8.0/24
          gateway: 172.30.8.1
